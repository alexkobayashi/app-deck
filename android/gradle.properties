# 2g é folgado para um módulo só. O padrão sugerido pelo Android Studio (4g),
# somado aos workers de lint, KSP e R8, estoura a RAM disponível numa máquina
# de 16 GB com a IDE aberta — o daemon morre com "insufficient memory".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Desligado de propósito: com um único módulo não há nada para paralelizar, e
# ligado ele só multiplica os processos disputando memória.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# O compilador Kotlin roda num daemon próprio, com heap próprio.
kotlin.daemon.jvmargs=-Xmx1g

android.useAndroidX=true

# R8 full mode desligado por causa do ML Kit.
#
# O full mode (padrão no AGP 8+) é mais agressivo e exige que a biblioteca
# traga regras de keep completas. O ML Kit descobre seus componentes lendo
# nomes de classe como *texto* nos meta-data do manifest e instanciando por
# reflexão; no full mode esses registrars eram removidos ou renomeados, o
# nome no manifest deixava de resolver, e o resultado era:
#
#   W/ComponentDiscovery: Could not instantiate CommonComponentRegistrar
#
# seguido de NPE ao criar o leitor, porque getClient devolvia um objeto com
# internos nulos. Só acontecia em release, nunca em debug.
android.enableR8.fullMode=false
# R classes não transitivas: cada módulo vê só os próprios recursos.
android.nonTransitiveRClass=true

kotlin.code.style=official
