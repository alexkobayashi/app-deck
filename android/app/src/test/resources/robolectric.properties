# O Robolectric só roda em APIs para as quais publica um jar de simulação, e
# ainda não há um para a 37 (o compileSdk/targetSdk do app). Fixar a 35 aqui
# evita anotar @Config em cada classe de teste.
#
# Isso não reduz a cobertura do que estes testes verificam: eles exercitam
# Room e lógica de repositório, não comportamento específico da plataforma.
sdk=35
